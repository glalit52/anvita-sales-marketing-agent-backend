# Local stack: Postgres + migrations + API + worker.   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      ANVITA_DATABASE_URL: postgresql+asyncpg://anvita:anvita@db:5432/anvita
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: [.env]
    environment:
      ANVITA_DATABASE_URL: postgresql+asyncpg://anvita:anvita@db:5432/anvita
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      ANVITA_DATABASE_URL: postgresql+asyncpg://anvita:anvita@db:5432/anvita
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
